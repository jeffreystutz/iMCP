name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read
    pull-requests: write

jobs:
    build:
        name: Build on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
        runs-on: macos-${{ matrix.macos }}
        env:
            DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - macos: "26"
                      xcode: "26.6"
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Cache Xcode build artifacts
              uses: actions/cache@v5
              with:
                  path: |
                      .build/DerivedData
                      ~/Library/Caches/org.swift.swiftpm
                  key: ${{ runner.os }}-xcode-${{ matrix.xcode }}-derived-${{ hashFiles('**/Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-xcode-${{ matrix.xcode }}-derived-

            - name: Lint
              run: swift format lint --strict --recursive .

            - name: Build
              run: xcodebuild -quiet -scheme iMCP -configuration Debug -destination "platform=macOS" -derivedDataPath .build/DerivedData build

            - name: Test
              run: xcodebuild -quiet -scheme imcp-serverTests -configuration Debug -destination "platform=macOS" -derivedDataPath .build/DerivedData test

            - name: Test elicitation proxy round trip
              run: python3 CLITests/test_elicitation_proxy.py .build/DerivedData/Build/Products/Debug/iMCP.app/Contents/MacOS/imcp-server
